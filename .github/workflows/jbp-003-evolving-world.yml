name: JBP-003 Evolving Virtual World Challenge

on:
  pull_request:
    branches: [main, "feat/jarvis-affective-state"]
    paths:
      - ".github/workflows/jbp-003-evolving-world.yml"
      - "core/cpp/tests/jbp_003_evolving_world_suite.cpp"
      - "core/cpp/tests/CMakeLists.txt"
      - "core/cpp/include/jarvis/core/developmental_world.hpp"
      - "core/cpp/include/jarvis/core/cognitive_runtime.hpp"
      - "core/cpp/src/**"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Space-separated deterministic seeds"
        required: true
        default: "17 29 43"
        type: string

permissions:
  contents: read

concurrency:
  group: jbp-003-evolving-world-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  evolving-world:
    name: JBP-003 · acquisition, reversal, persistence, and recall
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure native cognitive architecture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jbp-003-results
          echo "tested_commit=$(git rev-parse HEAD)" | tee jbp-003-results/metadata.txt
          echo "started_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a jbp-003-results/metadata.txt
          cmake -S core/cpp -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON 2>&1 | tee jbp-003-results/configure.log

      - name: Build evolving-world challenge
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel 2 --target jarvis_jbp_003_evolving_world_suite 2>&1 | tee jbp-003-results/build.log

      - name: Run independent-seed training and fresh-process recall
        shell: bash
        env:
          SEEDS: ${{ inputs.seeds || '17 29 43' }}
        run: |
          set -euo pipefail
          executable="$(find build -type f -name jarvis_jbp_003_evolving_world_suite -executable -print -quit)"
          test -n "$executable"
          for seed in $SEEDS; do
            journal="$RUNNER_TEMP/jbp-003-$seed.bin"
            echo "JBP-003 seed=$seed phase=train" | tee -a jbp-003-results/trials.log
            "$executable" train "$journal" "$seed" 2>&1 | tee -a jbp-003-results/trials.log
            echo "JBP-003 seed=$seed phase=fresh-process-verify" | tee -a jbp-003-results/trials.log
            "$executable" verify "$journal" "$seed" 2>&1 | tee -a jbp-003-results/trials.log
            cp "$journal" "jbp-003-results/journal-seed-$seed.bin"
            test -s "$journal"
          done
          echo "completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a jbp-003-results/metadata.txt

      - name: Record interpretation and limitations
        if: always()
        shell: bash
        run: |
          cat > jbp-003-results/scope.txt <<'EOF'
          JBP-003 tests the existing native cognitive runtime in a generated,
          partially observed virtual world. The evaluator randomizes the action
          rule per seed and withholds the rule from the brain. The world includes
          stochastic outcomes, separate contexts, a targeted reversal, an
          unchanged-context control, and fresh-process journal restoration.
          The verification phase withholds outcome feedback.
          
          A passing run is evidence only for this bounded task and these seeds.
          It does not establish general intelligence, arbitrary concept learning,
          language acquisition, visual recognition, or unrestricted self-improvement.
          Any failed seed is a failed challenge; do not hide it in an aggregate.
          EOF
          cat jbp-003-results/scope.txt

      - name: Preserve raw challenge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JBP-003-${{ github.run_id }}-${{ github.run_attempt }}
          path: jbp-003-results/
          if-no-files-found: warn
          retention-days: 90
