name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-deps .
      - run: python -m compileall -q jarvis methane_x tests
      - run: python -m unittest discover -s tests -v
