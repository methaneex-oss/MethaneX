name: Documentation Foundation — Blind Fresh-Reader Assessment

on:
  workflow_dispatch:
    inputs:
      target_revision:
        description: "Exact PR #192 documentation HEAD to assess"
        required: true
        type: string
      assessment_label:
        description: "Short run label for evidence artifacts"
        required: false
        default: "post-review-corrections-v3"
        type: string

permissions:
  contents: read

concurrency:
  group: documentation-foundation-ai-reader
  cancel-in-progress: false

jobs:
  blind-reader-assessment:
    name: Blind Fresh Tester — blind fresh-reader assessment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact documentation revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_revision }}
          fetch-depth: 1

      - name: Verify revision and assemble blind reader packet
        env:
          TARGET_DOCS_SHA: ${{ inputs.target_revision }}
          ASSESSMENT_LABEL: ${{ inputs.assessment_label }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_DOCS_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::target_revision must be a full 40-character commit SHA."; exit 1; }
          test "$(git rev-parse HEAD)" = "$TARGET_DOCS_SHA"
          mkdir -p documentation-foundation-reader-evidence
          git fetch --no-tags --depth=1 origin b05434758ad4fe72815503f89bd5d2990ccb658b
          git fetch --no-tags --depth=1 origin d7d676b79dbf3269f7fd3ebdb4363a6df19f255d
          git fetch --no-tags --depth=1 origin 756724b95e093ac48fcd95c5587117c0a4d8f3c0
          git fetch --no-tags --depth=1 origin 0811a59e46bf934e32e794f90e4e7d18d4e2bd97
          git fetch --no-tags --depth=1 origin b78e24b6fa122d1141b1f225bc6d29e1e7c77631
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess

          root = Path(".")
          docs = [
              ("README.md", os.environ["TARGET_DOCS_SHA"], "README.md"),
              ("docs/README.md", os.environ["TARGET_DOCS_SHA"], "docs/README.md"),
              ("docs/architecture/00_JARVIS_PLANNING_DOCUMENTATION_INDEX_2026-11-07.md", os.environ["TARGET_DOCS_SHA"], "docs/architecture/00_JARVIS_PLANNING_DOCUMENTATION_INDEX_2026-11-07.md"),
              ("docs/architecture/reports/WHOLE_BRAIN_PLANNING_SCOPE_AND_BUILDER_CORRECTION_2026-11-07.md", os.environ["TARGET_DOCS_SHA"], "docs/architecture/reports/WHOLE_BRAIN_PLANNING_SCOPE_AND_BUILDER_CORRECTION_2026-11-07.md"),
              ("docs/architecture/reports/PROJECT_DIRECTOR_DECISION_EVIDENCE_EXTRACTS_2026-11-10.md", os.environ["TARGET_DOCS_SHA"], "docs/architecture/reports/PROJECT_DIRECTOR_DECISION_EVIDENCE_EXTRACTS_2026-11-10.md"),
              ("docs/architecture/00_JARVIS_SYSTEM_ARCHITECTURE_FOUNDATION.md", "b05434758ad4fe72815503f89bd5d2990ccb658b", "docs/architecture/00_JARVIS_SYSTEM_ARCHITECTURE_FOUNDATION.md"),
              ("docs/architecture/01_JARVIS_WHOLE_SYSTEM_ANATOMY_AND_RESPONSIBILITY_MAP.md", "b05434758ad4fe72815503f89bd5d2990ccb658b", "docs/architecture/01_JARVIS_WHOLE_SYSTEM_ANATOMY_AND_RESPONSIBILITY_MAP.md"),
              ("docs/architecture/research/02_BRAIN_FOUNDATIONAL_CAPABILITY_INVESTIGATION_2026-11-03.md", "d7d676b79dbf3269f7fd3ebdb4363a6df19f255d", "docs/architecture/research/02_BRAIN_FOUNDATIONAL_CAPABILITY_INVESTIGATION_2026-11-03.md"),
              ("docs/architecture/02_BRAIN_FOUNDATION_ARCHITECTURE.md [current proposed architecture; not accepted]", "756724b95e093ac48fcd95c5587117c0a4d8f3c0", "docs/architecture/02_BRAIN_FOUNDATION_ARCHITECTURE.md"),
              ("docs/architecture/specifications/00_BRAIN_MECHANISM_SPECIFICATION.md [accepted baseline]", "0811a59e46bf934e32e794f90e4e7d18d4e2bd97", "docs/architecture/specifications/00_BRAIN_MECHANISM_SPECIFICATION.md"),
              ("docs/architecture/specifications/00_BRAIN_MECHANISM_SPECIFICATION.md [current corrected proposal]", "b78e24b6fa122d1141b1f225bc6d29e1e7c77631", "docs/architecture/specifications/00_BRAIN_MECHANISM_SPECIFICATION.md"),
          ]
          chunks, manifest = [], []
          for label, commit, path in docs:
              content = subprocess.check_output(["git", "show", f"{commit}:{path}"], text=True)
              chunks.append(f"\n\n===== DOCUMENT: {label}\nSOURCE COMMIT: {commit}\n=====\n\n{content}")
              manifest.append({
                  "path": label, "source_commit": commit,
                  "sha256": hashlib.sha256(content.encode()).hexdigest(),
                  "characters": len(content)
              })
          packet = "".join(chunks)
          out = Path("documentation-foundation-reader-evidence")
          (out / "reader_packet.md").write_text(packet)
          (out / "packet_manifest.json").write_text(json.dumps({
              "target_documentation_revision": os.environ["TARGET_DOCS_SHA"],
              "documents": manifest,
              "note": "Blind packet excludes Builder audit, self-review, remediation register, and prior reviewer reports."
          }, indent=2))
          PY

      - name: Request blind fresh-reader assessment from Blind Fresh Tester
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TARGET_DOCS_SHA: ${{ inputs.target_revision }}
          ASSESSMENT_LABEL: ${{ inputs.assessment_label }}
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}" || { echo "::error::Repository secret OPENROUTER_API_KEY is not configured."; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re, urllib.request, urllib.error, datetime

          out = Path("documentation-foundation-reader-evidence")
          assessment_label = os.environ["ASSESSMENT_LABEL"].strip()
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,64}", assessment_label):
              raise SystemExit("assessment_label must be 1-64 characters using only letters, digits, dot, underscore or hyphen.")
          packet = (out / "reader_packet.md").read_text()
          system = """You are the Blind Fresh Tester, an independent first-time documentation reader. You have no prior conversation context and must assess only the supplied repository documents. Do not assume that a claim is true merely because a document says so; distinguish what the documents establish, imply, contradict, or leave unknown. Do not use external sources. Do not reveal private chain-of-thought or hidden reasoning; provide concise conclusions with document-path and heading evidence. Do not rewrite the documents or design a new architecture."""
          user = """Perform a blind fresh-reader assessment of this JARVIS repository documentation packet.

          Imagine you have just arrived at the repository with no prior project context. Assess whether a technically capable newcomer can independently discover and correctly explain:
          1. What JARVIS is intended to be, and what it is not.
          2. The governing engineering principle and its practical implications.
          3. Why the Brain is a first construction target but not the whole intended product.
          4. The relationship between human-cognition research, fictional MCU inspiration, and engineering reality.
          5. Which documents are navigational, research inputs, accepted planning baselines, proposals, or historical context — and what evidence supports those distinctions.
          6. The current project phase, immediate objective, next permitted work, and explicit holds.
          7. What actions are not authorized (including implementation, PR integration, and gate clearance).
          8. Where a newcomer should go next for each role: general reader, Builder, reviewer, tester, researcher.

          Also test practical usability:
          - Can you identify a clear entry point and ordered reading path?
          - Are important concepts explained before being relied upon?
          - Are status/authority distinctions consistent across documents?
          - Treat dated addenda and old live-HEAD tables as historical snapshots when the index explicitly says so; do not combine their values into a synthetic current snapshot.
          - Distinguish direct GitHub decision records from later conversation-history transcriptions, and distinguish accepted baselines from later status-only revisions.
          - Treat the provisional portal as navigation, not authority.
          - Are PR #191 ancestry statements actually contradictory, or do they describe different comparisons?
          - Are BM, SYS, DF, F, and gate identifiers explained sufficiently for a newcomer?
          - Are links and cross-revision references understandable from the packet?
          - Does the packet explicitly identify which linked documents and GitHub records are intentionally external/not included, and avoid implying they were inspected?
          - Can the reader distinguish the packet's bounded evidence from materials that require opening a live link or separate repository revision?
          - Do any documents conflict, rely on unexplained jargon, assume missing context, or make authority claims that are not substantiated by the packet?
          - What would a new reader likely misunderstand or be unable to verify?

          Output exactly these sections:
          A. Overall result: CLEAR / PARTIALLY CLEAR / NOT CLEAR, with a short rationale.
          B. What I understand (numbered, evidence-backed).
          C. What I cannot establish or understand (numbered; say why).
          D. Contradictions, ambiguities, and likely reader traps (severity HIGH/MEDIUM/LOW).
          E. Navigation test (entry point, reading sequence, role routes).
          F. Eight-category scorecard (0–4 each, with one evidence citation per score).
          G. Minimum documentation corrections needed before an uninformed newcomer can reliably understand the project.
          H. Confidence and limitations.

          Evidence format: cite exact document path and section heading; cite source commit when relevant. Never invent content or claim you opened links not included in the packet. This is a reader test, not a formal independent-review decision and not Project Director acceptance.

          DOCUMENTATION PACKET:
          """ + packet

          body = {
              "model": "nvidia/nemotron-3.5-super-vl:free",
              "messages": [
                  {"role": "system", "content": system},
                  {"role": "user", "content": user}
              ],
              "temperature": 0.2,
              "max_tokens": 10000,
              # This model's free endpoint exhausted the entire output budget
              # on reasoning even at effort=low. Disable reasoning explicitly
              # so the assessment receives the completion budget.
              "reasoning": {"enabled": False},
              "stream": False
          }
          request = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=json.dumps(body).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["OPENROUTER_API_KEY"],
                  "Content-Type": "application/json",
                  "HTTP-Referer": "https://github.com/methaneex-oss/MethaneX",
                  "X-Title": "MethaneX Documentation Foundation Fresh Reader"
              },
              method="POST"
          )
          (out / "assessment_prompt.md").write_text(system + "\n\n" + user.split("DOCUMENTATION PACKET:")[0])
          try:
              with urllib.request.urlopen(request, timeout=300) as response:
                  response_status = response.status
                  response_request_id = response.headers.get("x-request-id") or response.headers.get("x-openrouter-request-id")
                  raw = json.loads(response.read().decode())
          except urllib.error.HTTPError as exc:
              # Never persist the provider's raw error body: it is untrusted and may
              # contain echoed request data. Keep only allowlisted diagnostic fields.
              request_id = exc.headers.get("x-request-id") or exc.headers.get("x-openrouter-request-id")
              request_id = request_id[:200] if isinstance(request_id, str) else None
              try:
                  error_payload = json.loads(exc.read().decode(errors="replace"))
              except Exception:
                  error_payload = {}
              error_obj = error_payload.get("error") if isinstance(error_payload, dict) else None
              error_obj = error_obj if isinstance(error_obj, dict) else {}
              error_type = error_obj.get("type")
              error_code = error_obj.get("code")
              provider = error_payload.get("provider") if isinstance(error_payload, dict) else None
              model = error_payload.get("model") if isinstance(error_payload, dict) else None
              (out / "api_error.json").write_text(json.dumps({
                  "http_status": exc.code,
                  "request_id": request_id,
                  "error_type": error_type[:128] if isinstance(error_type, str) else None,
                  "error_code": error_code[:128] if isinstance(error_code, str) else error_code if isinstance(error_code, int) else None,
                  "provider": provider[:128] if isinstance(provider, str) else None,
                  "model": model[:200] if isinstance(model, str) else None,
                  "raw_response_saved": False,
                  "api_key_saved": False,
                  "reasoning_saved": False
              }, indent=2))
              raise SystemExit(f"OpenRouter request failed with HTTP {exc.code}; sanitized diagnostics saved.")
          except Exception as exc:
              (out / "api_error.json").write_text(json.dumps({
                  "error_type": type(exc).__name__,
                  "raw_exception_message_saved": False,
                  "api_key_saved": False,
                  "reasoning_saved": False
              }, indent=2))
              raise SystemExit("OpenRouter request failed; sanitized diagnostics saved.")

          choices = raw.get("choices") if isinstance(raw, dict) else None
          choices = choices if isinstance(choices, list) else []
          choice = choices[0] if choices and isinstance(choices[0], dict) else {}
          message = choice.get("message") if isinstance(choice.get("message"), dict) else {}
          raw_content = message.get("content")
          content = None
          content_blocks = []
          if isinstance(raw_content, str):
              content = raw_content
          elif isinstance(raw_content, list):
              pieces = []
              for part in raw_content:
                  if not isinstance(part, dict):
                      continue
                  content_blocks.append({
                      "type": part.get("type"),
                      "has_text": isinstance(part.get("text"), str),
                      "has_content": isinstance(part.get("content"), str)
                  })
                  text_value = part.get("text")
                  if not isinstance(text_value, str):
                      text_value = part.get("content")
                  if isinstance(text_value, str):
                      pieces.append(text_value)
              content = "\n".join(pieces)
          if not isinstance(content, str) or not content.strip():
              alternative = message.get("output_text")
              if isinstance(alternative, str) and alternative.strip():
                  content = alternative
          if not isinstance(content, str) or not content.strip():
              legacy_text = choice.get("text")
              if isinstance(legacy_text, str) and legacy_text.strip():
                  content = legacy_text

          usage = raw.get("usage") if isinstance(raw, dict) else {}
          usage = usage if isinstance(usage, dict) else {}
          completion_details = usage.get("completion_tokens_details")
          completion_details = completion_details if isinstance(completion_details, dict) else {}
          metadata = {
              "assessment_label": assessment_label,
              "target_documentation_revision": os.environ["TARGET_DOCS_SHA"],
              "http_status": response_status,
              "request_id": response_request_id,
              "expected_provider": "Nvidia",
              "expected_model": "nvidia/nemotron-3.5-super-vl:free",
              "provider": raw.get("provider") if isinstance(raw, dict) else None,
              "model": raw.get("model") if isinstance(raw, dict) else None,
              "id": raw.get("id") if isinstance(raw, dict) else None,
              "created": raw.get("created") if isinstance(raw, dict) else None,
              "response_top_level_keys": sorted(raw.keys()) if isinstance(raw, dict) else [],
              "choice_count": len(choices),
              "choice_keys": sorted(choice.keys()) if choice else [],
              "message_keys": sorted(message.keys()) if message else [],
              "content_type": type(raw_content).__name__ if raw_content is not None else "missing",
              "content_characters": len(content) if isinstance(content, str) else 0,
              "content_block_shapes": content_blocks,
              "finish_reason": choice.get("finish_reason"),
              "native_finish_reason": choice.get("native_finish_reason"),
              "refusal_present": bool(message.get("refusal")),
              "tool_calls_present": bool(message.get("tool_calls")),
              "reasoning_present": bool(message.get("reasoning") or message.get("reasoning_details") or message.get("reasoning_content")),
              "reasoning_tokens": completion_details.get("reasoning_tokens"),
              "usage": {k: usage.get(k) for k in ("prompt_tokens", "completion_tokens", "total_tokens", "cost") if k in usage},
              "response_content_saved": bool(isinstance(content, str) and content.strip()),
              "reasoning_fields_saved": False,
              "completed_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          (out / "run_metadata.json").write_text(json.dumps(metadata, indent=2))

          if not isinstance(content, str) or not content.strip():
              diagnostics = {
                  "error": "OpenRouter returned no usable textual assistant content.",
                  "response_metadata": metadata,
                  "note": "Response body, prompt, API key, and reasoning content are intentionally not recorded."
              }
              (out / "api_error.json").write_text(json.dumps(diagnostics, indent=2))
              raise SystemExit("OpenRouter response contained no usable text; safe response-shape diagnostics were saved.")

          (out / "blind_fresh_tester_assessment.md").write_text(content)
          required_sections = ["A.", "B.", "C.", "D.", "E.", "F.", "G.", "H."]
          missing_sections = [section for section in required_sections if section not in content]
          if metadata["provider"] != "Nvidia" or metadata["model"] != "nvidia/nemotron-3.5-super-vl:free":
              raise SystemExit("Unexpected model identity; assessment and sanitized metadata were preserved.")
          if metadata["finish_reason"] != "stop":
              raise SystemExit(f"Assessment completion is invalid: expected finish_reason='stop', got {metadata['finish_reason']!r}; evidence was preserved.")
          if metadata["refusal_present"] or metadata["tool_calls_present"]:
              raise SystemExit("Assessment response contains a refusal or tool calls; evidence was preserved.")
          if len(content.strip()) < 1500 or missing_sections:
              metadata["assessment_validation"] = {
                  "passed": False,
                  "character_count": len(content.strip()),
                  "missing_sections": missing_sections,
                  "minimum_characters": 1500
              }
              (out / "run_metadata.json").write_text(json.dumps(metadata, indent=2))
              raise SystemExit("Blind Fresh Tester response failed completeness checks; response and metadata were preserved.")
          metadata["assessment_validation"] = {
              "passed": True,
              "character_count": len(content.strip()),
              "required_sections": required_sections
          }
          (out / "run_metadata.json").write_text(json.dumps(metadata, indent=2))
          print("Blind Fresh Tester assessment received and passed structural completeness checks. Sanitized metadata recorded; reasoning and API key excluded.")
          PY

      - name: Upload assessment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-foundation-blind-fresh-tester-${{ github.run_id }}-${{ github.run_attempt }}
          path: documentation-foundation-reader-evidence/
          if-no-files-found: warn
          retention-days: 90
