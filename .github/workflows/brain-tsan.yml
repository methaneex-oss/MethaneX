name: Brain ThreadSanitizer

on:
  push:
    branches: [main]
    paths:
      - 'core/cpp/**'
      - '.github/workflows/brain-tsan.yml'
  pull_request:
    paths:
      - 'core/cpp/**'
      - '.github/workflows/brain-tsan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tsan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure ThreadSanitizer
        run: >-
          cmake -S core/cpp -B build-tsan
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS='-fsanitize=thread -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=thread'

      - name: Build
        run: cmake --build build-tsan --parallel

      - name: Test under ThreadSanitizer
        working-directory: build-tsan
        run: ctest --output-on-failure --timeout 120
