name: JBP-004 Unseen Combination Transfer Challenge
# Re-run the behavioral challenge after failure-localization instrumentation.
# The world transition callback captures generated action names by value.

on:
  pull_request:
    branches: [main, "feat/jarvis-affective-state"]
    paths:
      - ".github/workflows/jbp-004-unseen-transfer.yml"
      - "core/cpp/tests/jbp_004_unseen_transfer_suite.cpp"
      - "core/cpp/tests/CMakeLists.txt"
      - "core/cpp/include/jarvis/core/developmental_world.hpp"
      - "core/cpp/include/jarvis/core/cognitive_runtime.hpp"
      - "core/cpp/src/**"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Space-separated deterministic seeds"
        required: true
        default: "17 29 43"
        type: string

permissions:
  contents: read

concurrency:
  group: jbp-004-unseen-transfer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  unseen-transfer:
    name: JBP-004 · compositional transfer and persisted recall
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure native cognitive architecture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jbp-004-results
          echo "tested_commit=$(git rev-parse HEAD)" | tee jbp-004-results/metadata.txt
          echo "started_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a jbp-004-results/metadata.txt
          cmake -S core/cpp -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON 2>&1 | tee jbp-004-results/configure.log

      - name: Build unseen-transfer challenge
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel 2 --target jarvis_jbp_004_unseen_transfer_suite 2>&1 | tee jbp-004-results/build.log

      - name: Run independent-seed training and fresh-process recall
        shell: bash
        env:
          SEEDS: ${{ inputs.seeds || '17 29 43' }}
        run: |
          set -euo pipefail
          executable="$(find build -type f -name jarvis_jbp_004_unseen_transfer_suite -executable -print -quit)"
          test -n "$executable"
          overall=0
          for seed in $SEEDS; do
            journal="$RUNNER_TEMP/jbp-004-$seed.bin"
            echo "JBP-004 seed=$seed phase=train" | tee -a jbp-004-results/trials.log
            if "$executable" train "$journal" "$seed" 2>&1 | tee -a jbp-004-results/trials.log; then
              echo "JBP-004 seed=$seed training_gate=PASS" | tee -a jbp-004-results/trials.log
            else
              overall=1
              echo "JBP-004 seed=$seed training_gate=FAIL" | tee -a jbp-004-results/trials.log
            fi
            if test -s "$journal"; then
              echo "JBP-004 seed=$seed phase=fresh-process-verify" | tee -a jbp-004-results/trials.log
              if "$executable" verify "$journal" "$seed" 2>&1 | tee -a jbp-004-results/trials.log; then
                echo "JBP-004 seed=$seed verification_gate=PASS" | tee -a jbp-004-results/trials.log
              else
                overall=1
                echo "JBP-004 seed=$seed verification_gate=FAIL" | tee -a jbp-004-results/trials.log
              fi
              cp "$journal" "jbp-004-results/journal-seed-$seed.bin"
            else
              overall=1
              echo "JBP-004 seed=$seed journal_missing=true verification=SKIPPED" | tee -a jbp-004-results/trials.log
            fi
          done
          exit "$overall"
          echo "completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a jbp-004-results/metadata.txt

      - name: Record interpretation and limitations
        if: always()
        shell: bash
        run: |
          cat > jbp-004-results/scope.txt <<'EOF'
          JBP-004 evaluates compositional transfer in the existing native cognitive
          runtime. Three combinations of weather and terrain are trained; the fourth
          combination is withheld from training. The evaluator keeps the two-factor
          parity rule hidden from the brain and injects 15% noisy outcomes.
          Fresh-process verification withholds outcome feedback and scores familiar
          combinations separately from the held-out transfer combination.

          This bounded task does not establish general intelligence or arbitrary
          concept learning. Every seed and every gate must be reported honestly.
          Training-gate failure does not suppress verification if a journal exists.
          EOF
          cat jbp-004-results/scope.txt

      - name: Preserve raw challenge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JBP-004-${{ github.run_id }}-${{ github.run_attempt }}
          path: jbp-004-results/
          if-no-files-found: warn
          retention-days: 90
