name: DF-02 All-Ref Source-Content Consumer Scan

on:
  push:
    branches:
      - audit/df02-all-ref-consumer-scan-20261120
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: df02-all-ref-consumer-scan
  cancel-in-progress: true

jobs:
  all-ref-scan:
    name: Enumerate all branch tips and index donor consumers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch all live branch refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git status --short

      - name: Syntax-check scanner
        shell: bash
        run: python3 -m py_compile tools/df02_all_ref_consumer_scan.py

      - name: Run scanner self-tests
        shell: bash
        run: python3 tools/df02_all_ref_consumer_scan.py --self-test

      - name: Run exact-ref all-branch source-content scan
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/df02_all_ref_consumer_scan.py --inputs tools/df02_all_ref_audit_inputs.json --output artifacts/df02

      - name: Upload complete machine-readable evidence
        uses: actions/upload-artifact@v4
        with:
          name: df02-all-ref-consumer-scan-\${{ github.sha }}
          path: artifacts/df02/
          if-no-files-found: error
          retention-days: 90
