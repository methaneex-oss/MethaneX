name: Documentation Link and Fragment Audit

on:
  push:
    branches:
      - docs/whole-brain-planning-scope-correction-20261107

permissions:
  contents: read
  actions: read

concurrency:
  group: documentation-link-audit
  cancel-in-progress: false

jobs:
  documentation-links:
    name: CommonMark/GFM link integrity and external reachability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Markdown parser with GFM extensions
        run: python -m pip install "markdown-it-py>=4,<5"

      - name: Self-test CommonMark/GFM and inline HTML extraction
        run: python scripts/audit_documentation_links.py --self-test

      - name: Audit all tracked Markdown destinations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/audit_documentation_links.py

      - name: Self-test rendered GitHub anchor verifier
        run: python scripts/verify_github_rendered_anchors.py --self-test

      - name: Verify anchors in rendered GitHub pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify_github_rendered_anchors.py

      - name: Preserve exact-revision audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-link-audit-${{ github.sha }}
          path: |
            documentation-link-audit.json
            rendered-github-anchors.json
          if-no-files-found: warn
          retention-days: 90


  df02-path-ownership:
    if: contains(github.event.head_commit.message, 'df02 ownership scan')
    name: Exact DF-02 branch-to-blob ownership map
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the pinned read-only all-ref scanner
        uses: actions/checkout@v6
        with:
          ref: audit/df02-all-ref-consumer-scan-20261120
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch every live remote branch ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Syntax-check scanner
        run: python3 -m py_compile tools/df02_all_ref_consumer_scan.py

      - name: Run scanner self-tests
        run: python3 tools/df02_all_ref_consumer_scan.py --self-test

      - name: Build exact branch-to-blob ownership map
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/df02_all_ref_consumer_scan.py --inputs tools/df02_all_ref_audit_inputs.json --output artifacts/df02

      - name: Build and test exact candidate C++ baseline
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/df02-candidate "${GITHUB_SHA}"
          cmake -S /tmp/df02-candidate/core/cpp -B /tmp/df02-candidate-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/df02-candidate-build --parallel 2
          ctest --test-dir /tmp/df02-candidate-build --output-on-failure

      - name: Build and test donor engineering task-ledger project
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/df02-donor c1da222e6c94aeb3f2ad000392c21fe4fc81ab25
          cmake -S /tmp/df02-donor/engineering/cpp -B /tmp/df02-engineering-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build /tmp/df02-engineering-build --parallel 2
          ctest --test-dir /tmp/df02-engineering-build --output-on-failure

      - name: Upload full ownership evidence
        uses: actions/upload-artifact@v4
        with:
          name: df02-branch-blob-ownership-${{ github.sha }}
          path: artifacts/df02/
          if-no-files-found: error
          retention-days: 90
