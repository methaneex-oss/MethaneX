name: Temporary Gate A Public API Inventory

on:
  pull_request:
    branches: [integration/priority-one-20261031]
    paths:
      - ".github/workflows/gate-a-api-inventory-temporary.yml"

permissions:
  contents: read

jobs:
  public-api-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inventory candidate public API references across C++ tree
        shell: bash
        run: |
          set -euo pipefail
          symbols=(
            record_knowledge_source_feedback learn_from_prediction predict_with_context
            resolve_prediction_feedback resolve_prediction assimilate_goal_outcome
            contextual_associations concept_candidates contextual_concepts generalized_concepts
            choose_with_affect choose_with_developmental_learning plan_with_affect
            knowledge_assessment developmental_associations developmental_strategies
            developmental_best_strategy developmental_best_related_strategy
            developmental_related_strategies developmental_feature_strategy_estimate
            attention_policy affective_state affective_appraisal affective_calibration
            affective_learning_updates record_evolution_evaluation import_legacy_memory_event
            execute_action register_evolution_parameter observe_evolution_canary
            observe_evolution_fitness adopt_evolution_experiment rollback_evolution
            activate_goal abandon_goal complete_goal create_goal update_goal_progress
            set_goal_priority assimilate_goal_outcome
          )
          for symbol in "${symbols[@]}"; do
            echo "===== ${symbol} ====="
            grep -RIlw --include='*.cpp' --include='*.hpp' "${symbol}" core/cpp | sort | while read -r file; do
              count="$(grep -cw "${symbol}" "${file}" || true)"
              echo "${file}:${count}"
            done
          done
          echo "===== BRAIN CONSTRUCTOR REFERENCES ====="
          grep -Rn -E --include='*.cpp' --include='*.hpp' '\\bBrain[[:space:]]*\\(' core/cpp || true
