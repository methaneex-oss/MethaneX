name: Temporary Gate A API Call-Site Inventory

on:
  pull_request:
    branches: [integration/priority-one-20261031]
    paths:
      - ".github/workflows/gate-a-api-inventory-temporary.yml"

permissions:
  contents: read

jobs:
  api-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan candidate declarations and call sites
        shell: bash
        run: |
          set -euo pipefail
          symbols=(
            abandon_goal activate_goal adopt_evolution adopt_evolution_experiment
            append_goal_event assimilate_goal_outcome choose choose_with_affect
            complete_goal create_goal isolate isolate_capability observe_capability
            observe_evolution_canary observe_evolution_fitness predict recover reflect
            register_evolution_parameter resolve_prediction restore_capability
            rollback_evolution set_goal_priority update_goal_progress
            developmental_best_related_strategy developmental_feature_strategy_estimate
            developmental_related_strategies import_legacy_memory_event
            record_evolution_evaluation record_knowledge_source_feedback
            resolve_prediction_feedback
          )
          for symbol in "${symbols[@]}"; do
            echo "===== ${symbol} ====="
            rg -l -w --glob '*.cpp' --glob '*.hpp' "${symbol}" core/cpp | sort | while read -r file; do
              count="$(rg -c -w "${symbol}" "${file}" || true)"
              echo "${file}:${count}"
            done
          done
          echo "===== CANDIDATE-ONLY DECLARATIONS/OVERLOADS AND CALL LINES ====="
          rg -n -w --glob '*.cpp' --glob '*.hpp'             'developmental_best_related_strategy|developmental_feature_strategy_estimate|developmental_related_strategies|import_legacy_memory_event|record_evolution_evaluation|record_knowledge_source_feedback|resolve_prediction_feedback|register_evolution_parameter'             core/cpp/include core/cpp/src core/cpp/tests
