name: JARVIS Brain Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  brain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S core/cpp -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --test-dir .
