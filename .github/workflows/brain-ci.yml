name: Brain CI

on:
  push:
    branches: [main]
    paths:
      - 'core/cpp/**'
      - '.github/workflows/brain-ci.yml'
  pull_request:
    paths:
      - 'core/cpp/**'
      - '.github/workflows/brain-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-brain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S core/cpp -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --timeout 30

  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >-
          cmake -S core/cpp -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'

      - name: Build
        run: cmake --build build-sanitized --parallel

      - name: Test under sanitizers
        working-directory: build-sanitized
        run: ctest --output-on-failure --timeout 60
