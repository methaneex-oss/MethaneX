name: JARVIS Learning Mechanisms Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/jarvis-learning-mechanisms.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Brain branch or commit to test"
        required: true
        default: "feat/jarvis-affective-state"
        type: string
      duration_minutes:
        description: "Changing-environment learning trial duration"
        required: true
        default: "10"
        type: choice
        options: ["10", "15", "20", "30"]
      seed:
        description: "Reproducible environment seed"
        required: true
        default: "20261026"
        type: string

permissions:
  contents: read

concurrency:
  group: jarvis-learning-mechanisms-${{ github.event.pull_request.number || inputs.source_ref || github.ref }}
  cancel-in-progress: false

jobs:
  learning-mechanisms:
    name: Explicit learning mechanism gates + integrated trial
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'feat/jarvis-affective-state' }}
      TRIAL_MINUTES: ${{ inputs.duration_minutes || '10' }}
      TRIAL_SEED: ${{ inputs.seed || '20261026' }}
    steps:
      - name: Checkout the brain revision under test
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || 'feat/jarvis-affective-state' }}

      - name: Record exact revision and validate inputs
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$TRIAL_MINUTES" =~ ^(10|15|20|30)$ ]]; then
            echo "TRIAL_MINUTES must be 10, 15, 20, or 30"
            exit 64
          fi
          if ! [[ "$TRIAL_SEED" =~ ^[0-9]+$ ]] || (( TRIAL_SEED > 9223372036854775805 )); then
            echo "TRIAL_SEED must be an integer from 0 through 9223372036854775805 so two additional seeds can be derived safely"
            exit 64
          fi
          mkdir -p learning-probe-results
          {
            echo "probe=JARVIS Learning Mechanisms Probe"
            echo "source_ref=$SOURCE_REF"
            echo "tested_commit=$(git rev-parse HEAD)"
            echo "trial_minutes=$TRIAL_MINUTES"
            echo "seed=$TRIAL_SEED"
            echo "started_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee learning-probe-results/metadata.txt
          printf "mechanism\ttest\tstatus\n" > learning-probe-results/mechanism-gates.tsv

      - name: Configure the native C++20 brain
        shell: bash
        run: |
          set -euo pipefail
          cmake -S core/cpp -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON 2>&1 | tee learning-probe-results/configure.log

      - name: Build brain and all registered mechanism suites
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel 2 2>&1 | tee learning-probe-results/build.log

      - name: Test each learning mechanism explicitly
        shell: bash
        run: |
          set -euo pipefail
          run_gate() {
            local mechanism="$1"
            local test_name="$2"
            local log="learning-probe-results/${test_name}.log"
            echo "::group::${mechanism} — ${test_name}"
            if ctest --test-dir build -R "^${test_name}$" --output-on-failure --timeout 120 2>&1 | tee "$log"; then
              printf "%s\t%s\tPASS\n" "$mechanism" "$test_name" | tee -a learning-probe-results/mechanism-gates.tsv
              echo "::endgroup::"
            else
              printf "%s\t%s\tFAIL\n" "$mechanism" "$test_name" | tee -a learning-probe-results/mechanism-gates.tsv
              echo "::endgroup::"
              return 1
            fi
          }

          run_gate "experience memory and consolidation" "jarvis_memory_architecture_suite"
          run_gate "knowledge and evidence assimilation" "jarvis_knowledge_memory_phase3_suite"
          run_gate "novelty and attention-guided learning" "jarvis_attention_learning_brain_suite"
          run_gate "general learning-loop adaptation and evolution proposals" "jarvis_learning_loop_architecture_suite"
          run_gate "association learning and causal transition learning" "jarvis_association_causality_phase5_suite"
          run_gate "prediction error and adaptation" "jarvis_learning_adaptation_phase8_suite"
          run_gate "prediction resolution, validation, and feedback" "jarvis_prediction_feedback_phase10_suite"
          run_gate "learning from failed evolution experiments" "jarvis_evolution_learning_suite"
          run_gate "evolution experiment proposal generation" "jarvis_evolution_experiment_suite"
          run_gate "evolution experiment coordination" "jarvis_evolution_experiment_coordinator_suite"
          run_gate "isolated evolution experiment execution" "jarvis_evolution_experiment_runner_suite"
          run_gate "evolution trial evaluation" "jarvis_evolution_trials_suite"
          run_gate "evolution scheduling and eligibility" "jarvis_evolution_scheduler_suite"
          run_gate "evolution monitoring and regression detection" "jarvis_evolution_monitor_suite"
          run_gate "evolution canary controls and safety gates" "jarvis_evolution_canary_controller_suite"
          run_gate "evolution opportunity discovery and orchestration" "jarvis_evolution_opportunity_orchestration_suite"
          run_gate "evolution proposals interacting with the brain" "jarvis_evolution_brain_integration_suite"
          run_gate "evolution adoption and journal evidence" "jarvis_evolution_adoption_journal_suite"
          run_gate "contextual strategy and association learning" "jarvis_developmental_learning_suite"
          run_gate "affective appraisal learning and calibration" "jarvis_affective_learning_suite"
          run_gate "affective state dynamics used by learning" "jarvis_affective_state_model_suite"
          run_gate "affective goal-outcome feedback" "jarvis_affective_goal_outcome_suite"
          run_gate "affective state influencing brain-level decisions" "jarvis_affective_brain_decision_suite"
          run_gate "cognitive runtime goal feedback" "jarvis_cognitive_runtime_goal_feedback_suite"
          run_gate "goal outcome model updating" "jarvis_goal_outcome_model_suite"
          run_gate "affective evidence, salience, and memory influence" "jarvis_affective_evidence_suite"
          run_gate "affective signals influencing decisions" "jarvis_affective_decision_learning_suite"
          run_gate "integrated developmental brain behavior" "jarvis_developmental_brain_integration_suite"
          run_gate "experience records and memory retrieval" "jarvis_experience_memory_test"
          run_gate "action consequences feeding back into the brain" "jarvis_brain_action_consequence_integration_suite"
          run_gate "learned action selection, revision, persistence, and transfer" "jarvis_developmental_training_environment_suite"
          run_gate "developmental environment transitions and feedback" "jarvis_developmental_environment_suite"
          run_gate "developmental world-state transition evidence" "jarvis_developmental_world_suite"
          run_gate "integrated developmental world feedback" "jarvis_developmental_world_integration_suite"
          run_gate "cross-process persistence and restored learning state" "jarvis_dlt_002_persistence_verify"

      - name: Run the integrated changing-environment learning trial
        shell: bash
        run: |
          set -euo pipefail
          executable="$(find build -type f -name jarvis_dlt_002_long_run -executable -print -quit)"
          test -n "$executable"
          duration_seconds=$((TRIAL_MINUTES * 60))
          trial_dir="learning-probe-results/integrated-trial"
          "$executable" "$duration_seconds" 30 "$trial_dir" "$TRIAL_SEED" 2>&1 | tee learning-probe-results/integrated-trial-console.log

          grep -q 'status=COMPLETED' "$trial_dir/trial.log"
          for phase in clear-baseline flooded tunnel clear-reversal generalization-probe flooded-reversal; do
            grep -q "$phase" "$trial_dir/episodes.csv" || {
              echo "Missing expected phase: $phase"
              exit 1
            }
          done
          awk -F, 'NR > 1 && $16 + 0 > 0 { found=1 } END { exit !found }' "$trial_dir/checkpoints.csv" || {
            echo "No resolved prediction evidence found"
            exit 1
          }
          echo "integrated_trial=PASS duration_seconds=$duration_seconds six_phases=PASS resolved_prediction_evidence=PASS" | tee learning-probe-results/integrated-trial-summary.txt

      - name: Repeat integrated trial with two additional seeds
        shell: bash
        run: |
          set -euo pipefail
          executable="$(find build -type f -name jarvis_dlt_002_long_run -executable -print -quit)"
          test -n "$executable"
          duration_seconds=$((TRIAL_MINUTES * 60))
          mkdir -p learning-probe-results/integrated-trials
          for offset in 1 2; do
            seed=$((TRIAL_SEED + offset))
            trial_dir="learning-probe-results/integrated-trials/seed-$seed"
            "$executable" "$duration_seconds" 30 "$trial_dir" "$seed" 2>&1 | tee "learning-probe-results/integrated-trial-seed-$seed-console.log"
            grep -q 'status=COMPLETED' "$trial_dir/trial.log"
            for phase in clear-baseline flooded tunnel clear-reversal generalization-probe flooded-reversal; do
              grep -q "$phase" "$trial_dir/episodes.csv" || {
                echo "Seed $seed missing expected phase: $phase"
                exit 1
              }
            done
            awk -F, 'NR > 1 && $16 + 0 > 0 { found=1 } END { exit !found }' "$trial_dir/checkpoints.csv" || {
              echo "Seed $seed has no resolved prediction evidence"
              exit 1
            }
            echo "integrated_trial=PASS seed=$seed duration_seconds=$duration_seconds"
          done

      - name: Compare phase performance across all three seeds
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          root = Path("learning-probe-results")
          trials = [("primary", root / "integrated-trial")]
          trials.extend(
              (path.name, path)
              for path in sorted((root / "integrated-trials").glob("seed-*"))
          )
          phases = ["clear-baseline", "flooded", "tunnel", "clear-reversal",
                    "generalization-probe", "flooded-reversal"]
          lines = ["## Three-seed DLT-002 comparison", "",
                   "Decision accuracy is measured against evaluation-only labels; it is not proof of general intelligence.", ""]
          scores = {phase: [] for phase in phases}
          for label, trial in trials:
              with (trial / "episodes.csv").open(newline="", encoding="utf-8") as handle:
                  episodes = list(csv.DictReader(handle))
              lines.append(f"### {label}")
              for phase in phases:
                  rows = [row for row in episodes if row["phase"] == phase]
                  correct = sum(row["optimal_action_selected"] == "1" for row in rows)
                  score = correct / len(rows) if rows else 0.0
                  lines.append(f"- {phase}: {correct}/{len(rows)} ({score:.1%})")
                  if rows:
                      scores[phase].append(score)
              early = sorted(
                  (row for row in episodes if row["phase"] == "generalization-probe"
                   and row["generalization_initial_window_episode"]),
                  key=lambda row: int(row["generalization_initial_window_episode"]),
              )
              if len(early) >= 10:
                  correct = sum(row["generalization_initial_window_optimal"] == "1" for row in early[:10])
                  lines.append(f"- First ten unseen-context decisions: {correct}/10 ({correct / 10:.1%})")
              lines.append("")
          lines.extend(["### Mean phase accuracy across seeds", ""])
          for phase in phases:
              values = scores[phase]
              if values:
                  lines.append(f"- {phase}: {sum(values) / len(values):.1%} across {len(values)} trials")

          lines.extend(["", "### Fixed-action reference baselines", "",
                        "These are evaluation-only comparisons using the same recorded episode labels, not additional brain runs. They measure whether adaptation beats a policy that always chooses one route."])
          for action in ("route-one", "route-two"):
              per_seed = []
              for _, trial in trials:
                  with (trial / "episodes.csv").open(newline="", encoding="utf-8") as handle:
                      rows = list(csv.DictReader(handle))
                  if rows:
                      per_seed.append(sum(row["expected_action_evaluation_only"] == action for row in rows) / len(rows))
              if per_seed:
                  lines.append(f"- Always choose {action}: mean optimal-action rate {sum(per_seed) / len(per_seed):.1%} across {len(per_seed)} trials")
          lines.extend(["", "Limit: fixed-action references are not a matched learning-disabled brain. A causal comparison still requires a controlled baseline that runs the same task without updating from outcomes.", ""])
          report = "\n".join(lines)
          (root / "three-seed-comparison.txt").write_text(report, encoding="utf-8")
          print(report)
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(report + "\n")
          if len(trials) != 3:
              raise SystemExit(f"Expected 3 trials, found {len(trials)}")
          PY

      - name: Analyze integrated trial evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import sys
          from pathlib import Path

          root = Path("learning-probe-results/integrated-trial")
          phases = [
              "clear-baseline", "flooded", "tunnel",
              "clear-reversal", "generalization-probe", "flooded-reversal",
          ]
          errors = []
          lines = [
              "DLT-002 trial diagnostics",
              "These are descriptive measurements, not proof of general-purpose learning.",
              "",
              "Phase decision accuracy (evaluation labels are used only by this analyzer):",
          ]

          with (root / "episodes.csv").open(newline="", encoding="utf-8") as handle:
              episodes = list(csv.DictReader(handle))

          for phase in phases:
              phase_rows = [row for row in episodes if row["phase"] == phase]
              correct = sum(row["optimal_action_selected"] == "1" for row in phase_rows)
              accuracy = correct / len(phase_rows) if phase_rows else 0.0
              lines.append(
                  f"- {phase}: {correct}/{len(phase_rows)} optimal actions "
                  f"({accuracy:.1%})"
              )
              if len(phase_rows) < 5:
                  errors.append(f"{phase} has only {len(phase_rows)} episodes; minimum is 5")

          probe_rows = [
              row for row in episodes
              if row["phase"] == "generalization-probe"
              and row["generalization_probe_episode_index"]
          ]
          probe_rows.sort(key=lambda row: int(row["generalization_probe_episode_index"]))
          if not probe_rows:
              errors.append("No decisions were recorded in the unseen generalization context")
              lines.append("- First unseen-context decision: unavailable")
          else:
              first = probe_rows[0]
              first_correct = first["optimal_action_selected"] == "1"
              lines.append(
                  f"- First decision in unseen context (before any canyon outcome feedback): "
                  f"{'optimal' if first_correct else 'not optimal'} "
                  f"({'1/1' if first_correct else '0/1'}); this is the cleanest local zero-experience transfer observation"
              )

          initial_window_rows = [
              row for row in episodes
              if row["phase"] == "generalization-probe"
              and row["generalization_initial_window_episode"]
          ]
          initial_window_rows.sort(
              key=lambda row: int(row["generalization_initial_window_episode"])
          )
          if len(initial_window_rows) < 10:
              errors.append(
                  f"Only {len(initial_window_rows)} labeled early generalization episodes; expected 10"
              )
              lines.append(
                  f"- Early generalization/adaptation window: {len(initial_window_rows)}/10 recorded; "
                  "estimate unavailable"
              )
          else:
              first_ten = initial_window_rows[:10]
              early_correct = sum(
                  row["generalization_initial_window_optimal"] == "1"
                  for row in first_ten
              )
              lines.append(
                  f"- First 10 decisions in unseen context: {early_correct}/10 optimal "
                  f"({early_correct / 10:.1%}); this window includes feedback after earlier decisions, "
                  "so it is an early adaptation measure, not a zero-shot transfer score"
              )

          # Checkpoints are periodic snapshots and can lag the actual trial end.
          # Use the completed trial's terminal summary for final prediction counts.
          completed_lines = [
              line for line in (root / "trial.log").read_text(encoding="utf-8").splitlines()
              if "status=COMPLETED" in line
          ]
          if len(completed_lines) != 1:
              errors.append(
                  f"Expected exactly one completed trial summary, found {len(completed_lines)}"
              )
          else:
              import re
              final_values = dict(re.findall(r"([A-Za-z_]+)=([^ ]+)", completed_lines[0]))
              required = {
                  "prediction_memories", "resolved_predictions",
                  "mean_absolute_prediction_error",
              }
              missing = sorted(required - final_values.keys())
              if missing:
                  errors.append(
                      "Completed trial summary is missing fields: " + ", ".join(missing)
                  )
              else:
                  predictions = int(final_values["prediction_memories"])
                  resolved = int(final_values["resolved_predictions"])
                  unresolved = predictions - resolved
                  if unresolved < 0:
                      errors.append(
                          f"Resolved prediction count ({resolved}) exceeds prediction count ({predictions})"
                      )
                  lines.extend([
                      "",
                      "Prediction lifecycle diagnostics (terminal trial summary):",
                      f"- prediction records: {predictions}",
                      f"- resolved predictions: {resolved}",
                      f"- unresolved estimate (records minus resolved): {max(0, unresolved)}",
                      f"- unresolved fraction: {max(0, unresolved) / predictions:.1%}"
                      if predictions else "- unresolved fraction: unavailable (zero prediction records)",
                      f"- mean absolute prediction error: {final_values['mean_absolute_prediction_error']}",
                      "",
                      "Unresolved count is a lifecycle signal, not automatically a defect: some predictions may be projections without a directly observed resolution path.",
                  ])

          report = "\n".join(lines) + "\n"
          (Path("learning-probe-results") / "trial-diagnostics.txt").write_text(
              report, encoding="utf-8"
          )
          print(report)
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Integrated trial diagnostics\n\n")
              summary.write(report)
              if errors:
                  summary.write("\n### Evidence integrity failures\n")
                  summary.write("\n".join(f"- {error}" for error in errors))
                  summary.write("\n")

          if errors:
              print("Evidence integrity checks failed:", file=sys.stderr)
              for error in errors:
                  print(f"- {error}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Summarize evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## Learning mechanism gate results"
            echo
            if test -f learning-probe-results/mechanism-gates.tsv; then
              echo 'Mechanism | Test | Status'
              echo '|---|---|---|'
              tail -n +2 learning-probe-results/mechanism-gates.tsv | awk -F '\t' '{printf "| %s | `%s` | %s |\n", $1, $2, $3}'
            fi
            echo
            echo "Exact tested commit: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve logs and trial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Learning-Probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: learning-probe-results/
          if-no-files-found: warn
          retention-days: 90
